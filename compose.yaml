services:
  postgres:
    image: postgres:18
    container_name: pellet-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pellet}
      POSTGRES_USER: ${POSTGRES_USER:-pellet_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - "pellet_pgdata:/var/lib/postgresql"

volumes:
  pellet_pgdata:
    name: ${POSTGRES_VOLUME:-pellet_pgdata}
